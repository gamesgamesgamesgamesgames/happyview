[package]
name = "happyview-source-jetstream"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "The Jetstream record source for HappyView"
license = "MIT"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
happyview-provider = { workspace = true }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_ipld_dagcbor = "0.6"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["any", "migrate"] }
tokio = { version = "1", features = ["full"] }
# rustls, with the root store passed in as a connector (see `consumer::tls`):
# its own webpki-roots feature brings in webpki-roots 0.26, a shim the
# RUSTSEC-2026-0381 advisory matches by version. The native-roots feature is
# here only to compile the rustls connector in; it is never consulted.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.14.3"

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
