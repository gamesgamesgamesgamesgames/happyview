[package]
name = "happyview-source-jetstream"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "The Jetstream record source for HappyView"
license = "MIT"

[dependencies]
async-stream = "0.3.6"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
happyview-provider = { workspace = true }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "charset", "http2", "macos-system-configuration", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_ipld_dagcbor = "0.6"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["any", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
zstd = "0.14.3"

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
