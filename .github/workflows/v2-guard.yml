name: v2-guard

# release/v2 only ships 2.17.x fixes. This refuses, before merge, what would
# take it off that line: a head that is another release branch, any history
# carrying a v3 tag, a feat or breaking commit or pull request title (a squash
# merge lands the title as the commit), which semantic-release would otherwise
# refuse only after the merge, at release time, and migrations that beta does
# not already have. See scripts/check-release-v2.sh.
#
# A workflow of its own so that `edited` can re-run it: a title changed after
# the checks passed must be checked again, and re-running all of CI on every
# edit would cost a full suite each time.

on:
  pull_request:
    branches: [release/v2]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: v2-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  v2-guard:
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch tags and beta
        run: git fetch --tags --force origin beta

      - name: Test the guard
        run: bash scripts/check-release-v2.test.sh

      # The title and body come in through the environment, never interpolated
      # into the script, because they are whatever the pull request's author
      # typed.
      - name: Check the change stays on 2.17.x
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/check-release-v2.sh "$BASE_SHA" HEAD
