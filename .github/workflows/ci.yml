name: CI

on:
  push:
    branches: [main, beta, alpha]
  pull_request:
    branches: [main, beta, alpha]
  workflow_dispatch:
    inputs:
      server:
        description: "Build server (unit tests, e2e, frontend, lint, release)"
        type: boolean
        default: true
      oauth-client:
        description: "Build oauth-client"
        type: boolean
        default: false
      oauth-client-browser:
        description: "Build oauth-client-browser"
        type: boolean
        default: false
      oauth-client-node:
        description: "Build oauth-client-node"
        type: boolean
        default: false
      lex-agent:
        description: "Build lex-agent"
        type: boolean
        default: false
      nsid:
        description: "Build nsid"
        type: boolean
        default: false
  delete:

env:
  SQLX_OFFLINE: true

permissions:
  id-token: write # Required for OIDC

jobs:
  # ---------------------------------------------------------------------------
  # Path detection — determines which job groups should run.
  # Required because workflow-level `paths` filters can't vary per job.
  # ---------------------------------------------------------------------------
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: depot-ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      oauth-client: ${{ steps.filter.outputs.oauth-client }}
      oauth-client-browser: ${{ steps.filter.outputs.oauth-client-browser }}
      oauth-client-node: ${{ steps.filter.outputs.oauth-client-node }}
      lex-agent: ${{ steps.filter.outputs.lex-agent }}
      nsid: ${{ steps.filter.outputs.nsid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            server:
              - 'src/**'
              - 'web/**'
              - 'migrations/**'
              - 'tests/**'
              - 'Cargo.*'
              - 'crates/**'
              - 'Dockerfile'
              - 'docker-compose*'
              - 'entrypoint.sh'
              - '.releaserc.json'
              # The guard scripts the jobs below run, and the jobs themselves:
              # a change that weakens a check has to face the suite it guards.
              - 'scripts/**'
              - '.github/workflows/**'
            oauth-client:
              - 'packages/oauth-client/**'
            oauth-client-browser:
              - 'packages/oauth-client/**'
              - 'packages/oauth-client-browser/**'
            oauth-client-node:
              - 'packages/oauth-client/**'
              - 'packages/oauth-client-node/**'
            lex-agent:
              - 'packages/oauth-client/**'
              - 'packages/lex-agent/**'
            nsid:
              - 'crates/happyview-nsid/**'
              - 'packages/nsid/**'

  # ---------------------------------------------------------------------------
  # Server — unit tests, e2e tests, frontend build, lint
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Build server binary — shared by playwright and pr-build (amd64)
  # ---------------------------------------------------------------------------
  build-server:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          platforms: linux/amd64
          cache-from: type=gha,scope=builder-linux/amd64
          cache-to: type=gha,scope=builder-linux/amd64,mode=max,ignore-error=true
          outputs: type=local,dest=.

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: happyview-server
          path: target/release/happyview

  unit-tests:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      # This job is deliberately database-free and fixture-free, so every test
      # that loads a plugin module skips here and runs for real under
      # `cargo test --tests` in e2e-tests. libtest captures the skip line of a
      # passing test, so without this the log would not say which coverage the
      # run left out. Reporting only: absent is the expected state here.
      - name: Report unbuilt plugin fixtures
        run: bash scripts/check-plugin-fixtures.sh

      - name: Run unit tests
        run: cargo test --lib

      # The native Lua runtime is off by default, and the tests that run a
      # script through it are gated with it. This step is the only coverage
      # the editor templates and the codemod's rewritten corpus have, and the
      # step above is not a second one: `luac` is almost certainly absent from
      # the runner, which leaves the corpus gated by `full_moon` alone, and
      # the assertion that a case's *source* compiles sits behind the feature
      # with the 5.4 compile it belongs to. Nothing here needs a database or a
      # fixture.
      - name: Run unit tests (native Lua reference)
        run: cargo test --features lua-reference --lib --test codemod_cases

      - name: Run crate tests
        run: cargo test --workspace --exclude happyview

  e2e-tests:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    # Headroom for the differential step, which rebuilds the library under a
    # different feature set and compiles PUC Lua from C to do it. A timeout
    # costs a whole run; splitting that step into a job of its own is the
    # answer if it ever earns one.
    timeout-minutes: 40
    env:
      # Read by every target that loads the interpreter, so it sits on the job
      # rather than on each of the three steps that reach one.
      #
      # `HAPPYVIEW_LUA_SRC`, which would turn a stale artefact into a failure,
      # is deliberately unset: it compares the module's modification time
      # against the plugin's sources, and this job holds no sources to compare
      # one against. What that guard protects a developer from — a hand-staged
      # artefact going quietly out of date — the pinned hash answers here.
      HAPPYVIEW_LUA_PLUGIN: ${{ github.workspace }}/lua-plugin
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: happyview
          POSTGRES_PASSWORD: happyview
          POSTGRES_DB: happyview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      # Reclaim ~20 GB of preinstalled tooling the Rust build never uses. The
      # e2e build (all test binaries in debug) plus the restored target cache
      # otherwise exhausts the runner disk ("No space left on device").
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # The interpreter is a published artefact of happyproto/plugins, and the
      # script holds the pinned version: the module these tests load is the
      # one an operator installs, and a HappyView commit stays re-runnable
      # against it after the plugin's source has moved on. Building it from a
      # branch instead answered for whichever source that branch held at the
      # time, and for a module nobody ships. The same script fills the browser
      # stack's mount and a developer's `HAPPYVIEW_LUA_PLUGIN`, so the pin
      # means one thing everywhere.
      #
      # Whether the plugin still *compiles* against this commit's SDK is the
      # plugins repository's question, and its CI asks it on every push by
      # resolving the SDK from this repository's `alpha`. Asked here is the
      # complement: that this host loads and drives the published module.
      - name: Fetch the Lua interpreter plugin
        run: |
          set -euo pipefail
          bash scripts/fetch-lua-plugin.sh lua-plugin
          # The module's identity beside the figures a recorded run reports is
          # what makes those figures checkable against what produced them.
          {
            echo '## Lua interpreter plugin'
            echo '```'
            ls -l lua-plugin
            sha256sum lua-plugin/*.wasm
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build plugin fixtures
        run: bash scripts/build-plugin-fixtures.sh

      # This is the job where the fixture-loading tests are supposed to run,
      # so here a missing module is a failure and not a skip. Without it a
      # build that stopped producing one would leave those tests skipping
      # inside a green run — quieter than the panic it replaced.
      - name: Verify plugin fixtures are built
        run: bash scripts/check-plugin-fixtures.sh --require

      # Same reasoning for the interpreter: the targets that load it skip when
      # it is absent, so a fetch that produced nothing would leave them
      # skipping inside a green run — among them the three refusal messages an
      # operator reads when a script will not save.
      - name: Verify the Lua interpreter is present
        run: bash scripts/check-lua-plugin.sh --require

      - name: Run plugin SDK tests
        run: cargo test -p happyview-plugin-sdk

      # Fast-failing, named gate: verify migrations apply on an *old* (v2.0.0)
      # database — schema + data, both SQLite and Postgres — not just a fresh one.
      # (Also included in the full run below; runs here first for a clear signal,
      # sharing the compiled test binary so the extra cost is ~a second.)
      - name: Migration upgrade test (old DB → latest)
        env:
          TEST_DATABASE_URL: postgres://happyview:happyview@localhost:5432/happyview_test
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --test migration_upgrade

      - name: Run e2e tests
        env:
          TEST_DATABASE_URL: postgres://happyview:happyview@localhost:5432/happyview_test
          # Drop debuginfo from the test build — it dominates target/ size and is
          # unnecessary in CI. Keeps the enlarged dependency build within disk.
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --tests

      # The only thing comparing the interpreter against the native runner
      # case for case, which is what lets the native one retire with evidence.
      # It needs the native runtime behind `lua-reference` and it is
      # `#[ignore]`d for being slow, so neither the feature nor the flag can
      # ride the run above. `--nocapture` because libtest swallows a passing
      # test's output, and the module's identity and the case figures are that
      # output.
      - name: Lua interpreter against the native runner
        env:
          TEST_DATABASE_URL: postgres://happyview:happyview@localhost:5432/happyview_test
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test --features lua-reference --test lua_differential -- --ignored --nocapture

  # Runs the unit, crate, and e2e suites once under LLVM source-based
  # instrumentation. Informational for now: no threshold gates the PR.
  coverage:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: happyview
          POSTGRES_PASSWORD: happyview
          POSTGRES_DB: happyview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Instrumented artifacts differ from the plain test build, so they get
      # their own cache rather than evicting the `test` one.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install LLVM tools
        run: rustup component add llvm-tools

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # `--workspace` below runs every fixture-loading test, so this job needs
      # the whole set and not the one plugin a narrower run would reach.
      - name: Build plugin fixtures
        run: bash scripts/build-plugin-fixtures.sh

      - name: Verify plugin fixtures are built
        run: bash scripts/check-plugin-fixtures.sh --require

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgres://happyview:happyview@localhost:5432/happyview_test
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo llvm-cov --workspace --no-report

      - name: Generate reports
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html
          {
            echo '## Rust coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html

  frontend:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

  lint:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Check that a default build links no Lua interpreter
        run: bash scripts/check-no-native-lua.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (native Lua reference)
        run: cargo clippy --features lua-reference --all-targets -- -D warnings

  audit:
    needs: changes
    if: always() && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on any advisory not triaged in .cargo/audit.toml, so newly
      # disclosed vulnerabilities in our dependencies are caught.
      - name: Audit dependencies
        run: cargo audit

  playwright:
    needs: [changes, frontend, build-server]
    if: >-
      always()
      && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
      && needs.frontend.result == 'success'
      && needs.build-server.result == 'success'
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: happyview-server
          path: .builder-override/app/target/release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The stack's `lua` interpreter is the published plugin, bind-mounted by
      # docker-compose.e2e.yml, and saving a script asks the interpreter its
      # language names whether the body is one it can run. The directory is
      # gitignored, so without this step Docker binds an empty one, every save
      # is refused and `globalSetup` stops the run. Same pinned version as
      # `e2e-tests`, since the script is the one place it is written down.
      - name: Fetch the stack's interpreter
        run: bash scripts/fetch-lua-plugin.sh

      - name: Start E2E services
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.ci.yml up -d --build --wait
        timeout-minutes: 10

      - name: Log resolved Tranquil PDS image
        run: |
          docker image inspect ghcr.io/happyproto/pds-test/tranquil:latest \
            --format 'tranquil-pds resolved to {{.RepoTags}} digest {{.RepoDigests}}'

      - name: Run Playwright tests
        working-directory: web
        run: npx playwright test

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.ci.yml logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose.e2e.yml -f docker-compose.e2e.ci.yml down -v

  # ---------------------------------------------------------------------------
  # PR builds — compile + Docker on every PR push so reviewers can test
  #
  # This job only builds. Fork PRs get a read-only token, so the image is
  # exported as an artifact and `pr-images.yml` pushes it to GHCR and comments
  # on the PR from the base repository's context.
  #
  # A PR opened from a release branch is skipped: that branch's own push run has
  # already built and published the same head, so the image would be a duplicate
  # of one reviewers can already pull.
  # ---------------------------------------------------------------------------
  pr-build:
    needs: [changes, build-server]
    if: >-
      github.event_name == 'pull_request'
      && !contains(fromJSON('["beta", "alpha"]'), github.head_ref)
      && needs.changes.outputs.server == 'true'
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: depot-ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runs-on: depot-ubuntu-24.04-arm
            arch: arm64
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download server binary (amd64)
        if: matrix.arch == 'amd64'
        uses: actions/download-artifact@v8
        with:
          name: happyview-server
          path: target/release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release binary (arm64)
        if: matrix.arch != 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=builder-${{ matrix.platform }}
          cache-to: type=gha,scope=builder-${{ matrix.platform }},mode=max,ignore-error=true
          outputs: type=local,dest=.

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: happyview-linux-${{ matrix.arch }}
          path: target/release/happyview

      - name: Prepare binary override
        run: |
          mkdir -p .builder-override/app/target/release
          cp target/release/happyview .builder-override/app/target/release/happyview

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: |
            builder=.builder-override
          cache-from: type=gha,scope=pr-${{ matrix.platform }}
          cache-to: type=gha,scope=pr-${{ matrix.platform }},mode=max,ignore-error=true
          # The docker exporter can't carry attestations.
          provenance: false
          outputs: type=docker,name=happyview-pr:${{ matrix.arch }},dest=happyview-image-${{ matrix.arch }}.tar

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: happyview-image-${{ matrix.arch }}
          path: happyview-image-${{ matrix.arch }}.tar
          retention-days: 7

  pr-build-metadata:
    needs: pr-build
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Record PR number
        # `workflow_run` payloads omit the PR for forks, so pr-images.yml reads
        # it from here and verifies it against the PR's head SHA.
        run: echo "${{ github.event.pull_request.number }}" > pr-number

      - name: Upload PR metadata
        uses: actions/upload-artifact@v7
        with:
          name: pr-build-metadata
          path: pr-number
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Server release
  # ---------------------------------------------------------------------------
  release:
    if: >-
      always()
      && contains(fromJSON('["refs/heads/main", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)
      && (needs.changes.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.server))
      && needs.unit-tests.result == 'success'
      && needs.e2e-tests.result == 'success'
      && needs.frontend.result == 'success'
      && needs.playwright.result == 'success'
      && needs.lint.result == 'success'
    needs: [changes, unit-tests, e2e-tests, frontend, playwright, lint]
    runs-on: depot-ubuntu-24.04
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.DISPATCH_GH_TOKEN }}
        run: npx -p semantic-release -p semantic-release-gha-output semantic-release

  # ---------------------------------------------------------------------------
  # Build + Docker — compile per-platform, upload to GitHub release, push image
  # ---------------------------------------------------------------------------
  build:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: depot-ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runs-on: depot-ubuntu-24.04-arm
            arch: arm64
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      ATCR_IMAGE: atcr.io/${{ secrets.ATCR_NAMESPACE }}/happyview
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build release binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          build-args: |
            HAPPYVIEW_VERSION=v${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=builder-${{ matrix.platform }}
          cache-to: type=gha,scope=builder-${{ matrix.platform }},mode=max,ignore-error=true
          outputs: type=local,dest=.

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_GH_TOKEN }}
        run: |
          cp target/release/happyview happyview-linux-${{ matrix.arch }}
          gh release upload "v${{ needs.release.outputs.version }}" \
            happyview-linux-${{ matrix.arch }} \
            --clobber

      - name: Prepare binary override
        run: |
          mkdir -p .builder-override/app/target/release
          cp target/release/happyview .builder-override/app/target/release/happyview

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # TODO: Re-enable once ATCR rate limit issue is resolved
      # - name: Log in to ATCR
      #   uses: docker/login-action@v4
      #   with:
      #     registry: atcr.io
      #     username: ${{ secrets.ATCR_USERNAME }}
      #     password: ${{ secrets.ATCR_PASSWORD }}

      - name: Parse version
        id: version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"
          # A `-` suffix marks a prerelease (e.g. 3.0.0-alpha.1), which must
          # never move the stable moving tags.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "full=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Extract GHCR metadata
        id: meta-ghcr
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.prerelease == 'false' }}
            type=sha

      # TODO: Re-enable once ATCR rate limit issue is resolved
      # - name: Extract ATCR metadata
      #   id: meta-atcr
      #   uses: docker/metadata-action@v6
      #   with:
      #     images: ${{ env.ATCR_IMAGE }}
      #     tags: |
      #       type=semver,pattern={{version}}
      #       type=semver,pattern={{major}}.{{minor}}
      #       type=semver,pattern={{major}}
      #       type=sha

      - name: Build and push to GHCR by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          build-contexts: |
            builder=.builder-override
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,scope=build-${{ matrix.platform }},mode=max,ignore-error=true
          outputs: type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      # TODO: Re-enable once ATCR rate limit issue is resolved
      # - name: Push to ATCR by digest
      #   id: build-atcr
      #   continue-on-error: true
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: .
      #     platforms: ${{ matrix.platform }}
      #     labels: ${{ steps.meta-atcr.outputs.labels }}
      #     build-contexts: |
      #       builder=.builder-override
      #     cache-from: type=gha,scope=build-${{ matrix.platform }}
      #     outputs: type=image,"name=${{ env.ATCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Create GHCR manifest
        run: |
          GHCR_TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-ghcr.outputs.json }}')
          docker buildx imagetools create --append $GHCR_TAGS \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }} 2>/dev/null || \
          docker buildx imagetools create $GHCR_TAGS \
            ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}

      # TODO: Re-enable once ATCR rate limit issue is resolved
      # - name: Create ATCR manifest
      #   if: steps.build-atcr.outcome == 'success'
      #   continue-on-error: true
      #   run: |
      #     ATCR_TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-atcr.outputs.json }}')
      #     if [ -n "$ATCR_TAGS" ]; then
      #       docker buildx imagetools create --append $ATCR_TAGS \
      #         ${{ env.ATCR_IMAGE }}@${{ steps.build-atcr.outputs.digest }} 2>/dev/null || \
      #       docker buildx imagetools create $ATCR_TAGS \
      #         ${{ env.ATCR_IMAGE }}@${{ steps.build-atcr.outputs.digest }}
      #     fi

  # ---------------------------------------------------------------------------
  # `latest` — retag the finished multi-arch manifest.
  #
  # Deliberately not part of `build`'s tag set: those tags are applied per-arch
  # with `imagetools create --append`, which would append this release's digests
  # onto whatever index `latest` already points at. `latest` needs no build at
  # all — once `build` completes, the versioned manifest exists and this is a
  # single atomic retag of it.
  #
  # Skipped for prereleases, since `release` also runs on the prerelease
  # branches.
  # ---------------------------------------------------------------------------
  tag-latest:
    needs: [release, build]
    if: needs.release.outputs.version != '' && !contains(needs.release.outputs.version, '-')
    runs-on: depot-ubuntu-24.04
    permissions:
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at the released version
        run: |
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:latest" \
            "${GHCR_IMAGE}:${{ needs.release.outputs.version }}"

  # ---------------------------------------------------------------------------
  # SDK — per-package tests + releases
  # ---------------------------------------------------------------------------
  test-oauth-client:
    needs: changes
    if: always() && (needs.changes.outputs.oauth-client == 'true' || (github.event_name == 'workflow_dispatch' && inputs.oauth-client))
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run --filter '@happyview/oauth-client' build

      - name: Typecheck
