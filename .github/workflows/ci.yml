        run: bun run --filter '@happyview/lex-agent' typecheck

      - name: Test
        run: bun run --filter '@happyview/lex-agent' test

  test-nsid:
    needs: changes
    if: always() && (needs.changes.outputs.nsid == 'true' || (github.event_name == 'workflow_dispatch' && inputs.nsid))
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run --filter '@happyview/nsid' build

      - name: Typecheck
        run: bun run --filter '@happyview/nsid' typecheck

      - name: Test
        run: bun run --filter '@happyview/nsid' test

  release-oauth-client:
    if: >-
      always()
      && contains(fromJSON('["refs/heads/main", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)
      && (needs.changes.outputs.oauth-client == 'true' || (github.event_name == 'workflow_dispatch' && inputs.oauth-client))
      && needs.test-oauth-client.result == 'success'
    needs: [changes, test-oauth-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install

      - name: Build oauth-client
        run: bun run --filter '@happyview/oauth-client' build

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Release oauth-client
        env:
          GITHUB_TOKEN: ${{ secrets.DISPATCH_GH_TOKEN }}
        working-directory: packages/oauth-client
        run: npx semantic-release

  release-oauth-client-browser:
    if: >-
      always()
      && contains(fromJSON('["refs/heads/main", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)
      && (needs.changes.outputs.oauth-client-browser == 'true' || (github.event_name == 'workflow_dispatch' && inputs.oauth-client-browser))
      && needs.test-oauth-client-browser.result == 'success'
      && (needs.release-oauth-client.result == 'success' || needs.changes.outputs.oauth-client != 'true')
    needs: [changes, test-oauth-client-browser, release-oauth-client]
    runs-on: ubuntu-latest
    permissions:
