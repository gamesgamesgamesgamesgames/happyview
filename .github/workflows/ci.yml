  # ---------------------------------------------------------------------------
  # Mirror to Tangled
  # ---------------------------------------------------------------------------
  mirror:
    # PRs have nothing to mirror, and fork PRs can't read the SSH key.
    if: github.event_name != 'pull_request'
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: yesolutions/mirror-action@master
        with:
          REMOTE: "git@tangled.org:gamesgamesgamesgames.games/happyview"
          GIT_SSH_PRIVATE_KEY: ${{ secrets.TANGLED_SSH_PRIVATE_KEY }}
          GIT_SSH_NO_VERIFY_HOST: "true"
