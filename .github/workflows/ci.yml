  release-lex-agent:
    if: >-
      always()
      && contains(fromJSON('["refs/heads/main", "refs/heads/beta", "refs/heads/alpha"]'), github.ref)
      && (needs.changes.outputs.lex-agent == 'true' || (github.event_name == 'workflow_dispatch' && inputs.lex-agent))
      && needs.test-lex-agent.result == 'success'
      && (needs.release-oauth-client.result == 'success' || needs.changes.outputs.oauth-client != 'true')
    needs: [changes, test-lex-agent, release-oauth-client]
