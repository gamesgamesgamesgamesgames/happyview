# cargo-audit configuration.
#
# The ignored advisories below have been triaged and have no upstream fix.
# Every other advisory must fail CI (see .github/workflows/ci.yml `audit` job) so
# new ones are caught. Re-review this list when dependencies are updated.
[advisories]
ignore = [
    # fxhash: unmaintained (warning, not a vulnerability). Transitive dependency
    # of wasmtime (via fxprof-processed-profile); not removable independently.
    "RUSTSEC-2025-0057",
    # webpki-roots: distrusted emSign root, patched only in 1.0.10. The lockfile
    # has 1.0.10, but tokio-tungstenite (0.29 and 0.30 alike) depends on 0.26,
    # whose last release is a shim that re-exports 1.x and so carries 1.0.10's
    # roots. The advisory matches the shim by version number alone. Remove this
    # once tokio-tungstenite depends on webpki-roots 1.
    "RUSTSEC-2026-0381",
    # crypto-bigint 0.5.5: timing variability in operations meant to be
    # constant-time, fixed only in 0.7.6. The 0.7 copy is updated; 0.5.5 comes
    # from elliptic-curve 0.13 under p256 0.13, which atrium-oauth 0.1.7 and
    # jose-jwk 0.1.2 (both the latest) require. atrium-oauth signs its DPoP
    # proofs and private_key_jwt client assertions with it, so a remote timing
    # attack on those signatures is the exposure. Ignoring by ID also covers
    # the 0.7 line, which the lockfile has at a fixed version. Remove this once
    # atrium-oauth moves to p256 0.14.
    "RUSTSEC-2026-0387",
]
