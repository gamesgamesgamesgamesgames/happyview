# --- apply-writes-shape ----------------------------------------------------
- assertion: records.apply-writes-atomic
  cause: apply-writes-shape
  reason: "applyWrites takes `action`-tagged writes, not the lexicon's `$type` union, so a spec-shaped batch is refused."
  spec: "#xrpc-api"
  tracking: HAP-414
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: "applyWrites answered 422"
    evidence:
      body: "\"Failed to deserialize the JSON body into the target type: writes\\[0\\]: missing field `action` at line 1 column \\d+\""
- assertion: digest.multi-batch
  cause: apply-writes-shape
  reason: "applyWrites takes `action`-tagged writes, not the lexicon's `$type` union, so a spec-shaped batch is refused."
  spec: "#xrpc-api"
  tracking: HAP-414
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: "applyWrites \\(20 writes\\) answered 422"
    evidence:
      body: "\"Failed to deserialize the JSON body into the target type: writes\\[0\\]: missing field `action` at line 1 column \\d+\""
- assertion: oplog.pagination-batch-boundary
  cause: apply-writes-shape
  reason: "applyWrites takes `action`-tagged writes, not the lexicon's `$type` union, so a spec-shaped batch is refused."
