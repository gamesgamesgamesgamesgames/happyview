# HappyView's known deviations from Proposal 0016, for the spaces conformance
# suite (https://github.com/happyproto/spaces-conformance). The suite reads this
# file at the commit each HappyView image was built from.
#
# Each entry states the exact failure it covers (`expect`): any other failure
# on the same assertion fails the run, and so does a pass while the entry is
# still listed. A PR that fixes a deviation removes its entry.
#
# Format: https://github.com/happyproto/spaces-conformance/blob/main/docs/catalogue.md#deviations
# Check: node cli/validate.ts --deviations <this file>   (in the suite repo)
#
# Recorded against 3.0.0-beta.14 on 2026-11-13. Every entry covers only the
# 2026-10-29 revision: this release predates 2026-11-12 support.


# --- repo-host-pre-0016 ----------------------------------------------------
- assertion: records.commit-fields
  cause: repo-host-pre-0016
  reason: "getLatestCommit and listRepoOps take a required `did`, not the lexicon's `repo`, so the spec-shaped call is refused before any handler runs."
  spec: "#xrpc-api"
  tracking: HAP-388 (PR 6)
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: "getLatestCommit answered 400"
    evidence:
      body: "\"Failed to deserialize query string: missing field `did`\""
