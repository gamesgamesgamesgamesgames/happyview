# --- space-deleted-error ---------------------------------------------------
- assertion: deletion.credential-error
  cause: space-deleted-error
  reason: "After deleteSpace, getSpaceCredential answers SpaceNotFound rather than the SpaceDeleted error 0016 asks for."
  spec: "#space-deletion"
  tracking: HAP-388 (PR 7)
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: "getSpaceCredential for a deleted space answered SpaceNotFound, not SpaceDeleted"
- assertion: deletion.credential-error
  cause: space-deleted-error
  reason: "After deleteSpace, authorizeSpaceSync answers SpaceNotFound rather than the SpaceDeleted error 0016 asks for."
  spec: "#space-deletion"
  tracking: HAP-388 (PR 7)
  since: "2026-11-22"
  revisions: ["2026-11-12"]
  expect:
    message: "authorizeSpaceSync for a deleted space answered SpaceNotFound, not SpaceDeleted"

# --- unregister-notify-auth ------------------------------------------------
- assertion: writers.register-expiry
  cause: unregister-notify-auth
  reason: "Called with a space credential, unregisterNotify is refused unless the caller is the space's admin: the credential isn't taken as the registered service."
  spec: "#write-notifications"
  tracking: HAP-388 (PR 6)
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: 'unregisterNotify answered 403 \{"error":"Only the space''s creator can perform this action"\}'
- assertion: writers.register-expiry
  cause: notify-registration
  reason: "authorizeSpaceSync refuses a `notify` registration by name: this release doesn't take registrations that way yet."
  spec: "#registering-for-notifications"
  tracking: HAP-388 (PR 6)
  since: "2026-11-22"
  revisions: ["2026-11-12"]
  expect:
    message: 'authorizeSpaceSync with notify answered 400 \{"error":"InvalidRequest","message":"this host does not take notification registrations through authorizeSpaceSync yet; omit notify"\}, though it issues credentials without one'

# --- deletion-notice-retry -------------------------------------------------
- assertion: deletion.notify-retry
  cause: deletion-notice-retry
  reason: "After the registered syncer answers 503 to notifySpaceDeleted, the notice is not delivered again."
  spec: "#space-deletion"
  tracking: HAP-388 (PR 7)
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    # A run without --slow waits 120 s and pends; a --slow run waits 900 s.
    message: "after the syncer answered 503, the deletion notice was not delivered again within 900 s"
