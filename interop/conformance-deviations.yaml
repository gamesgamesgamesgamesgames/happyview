# --- create-record-rkey ----------------------------------------------------
- assertion: records.crud-roundtrip
  cause: create-record-rkey
  reason: "createRecord ignores the caller's `rkey` and assigns a TID."
  spec: "#xrpc-api"
  tracking: HAP-414
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: "createRecord's uri at://did:plc:[a-z2-7]{24}/space/com\\.example\\.conformance\\.space/[0-9a-f]+/did:plc:[a-z2-7]{24}/com\\.example\\.conformance\\.note/[a-z2-7]{13} doesn't end in the chosen rkey"
    evidence:
      status: "201"

# --- memberspace-under-simplespace -----------------------------------------
- assertion: policy.member-methods
  cause: memberspace-under-simplespace
  reason: "The memberspace methods aren't routed in this release. Members are served only under com.atproto.simplespace.*, so com.atproto.memberspace.putMember falls through to the proxy and fails."
  spec: "#memberspace"
  tracking: HAP-388 (PR 5b)
  since: "2026-11-13"
  revisions: ["2026-10-29"]
  expect:
    message: "memberspace\\.putMember answered 502"
- assertion: policy.put-member-upsert
  cause: memberspace-under-simplespace
  reason: "The memberspace methods aren't routed in this release. Members are served only under com.atproto.simplespace.*, so com.atproto.memberspace.putMember falls through to the proxy and fails."
